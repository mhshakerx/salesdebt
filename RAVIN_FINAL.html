<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAVIN - Sales Analyzer V4</title>
<style>
:root{--bg:#0F1720;--surface:#17212C;--ink:#E5ECF3;--muted:#93A4B5;--line:#2A3947;--head:#1D2A37;--accent:#7DB3E3;--accent-ink:#0B1620;--bar:#24435F;--good:#62C998;--bad:#F18D85;--warn-bg:#3A2F12;--warn-ink:#F3D58A;--chip-bg:#1E2E3D;--font:"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;--mono:Consolas,monospace;color-scheme:dark}
:root[data-theme="light"]{--bg:#F4F6F9;--surface:#FFFFFF;--ink:#17232F;--muted:#5A6A7A;--line:#D8DFE7;--head:#EDF1F6;--accent:#1F4E78;--accent-ink:#FFFFFF;--bar:#D3E3F2;--good:#1D7A4D;--bad:#B1352C;--warn-bg:#FFF4DB;--warn-ink:#6B4B00;--chip-bg:#E8EEF5;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font);transition:background .25s,color .25s}
.wrap{max-width:1520px;margin:0 auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;gap:10px}
.logo-area{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#0B1E33,#2B7AC0 55%,#7DB3E3);color:#fff;font-weight:900;font-size:20px}
.hgroup h1{margin:0;font-size:20px;font-weight:700}.hgroup .by{font-size:11px;color:var(--muted)}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;transition:all .2s}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:12px}
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--surface);padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;transition:all .2s}.drop.over{border-color:var(--accent);background:var(--head)}.drop .big{font-size:17px;font-weight:700}
.file-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.file-label input{position:absolute;width:1px;height:1px;opacity:0}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-start}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field>label,.field>.lbl{font-size:11px;color:var(--muted);font-weight:700}
.field select,.field input[type=number],.field input[type=date]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:130px;color:var(--ink)}.field input[type=number]{width:90px}
.multi-dept{position:relative;min-width:280px;max-width:380px}.multi-trigger{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;min-height:38px;align-items:center}.multi-trigger .ph{color:var(--muted);font-size:12px}
.dept-chip{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 8px;font-size:12px;display:inline-flex;align-items:center;gap:4px}.dept-chip button{background:transparent;border:0;color:inherit;cursor:pointer;font-weight:900;padding:0 2px}
.multi-panel{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;z-index:20;padding:8px;display:none;box-shadow:0 10px 24px rgba(0,0,0,.35)}.multi-panel.open{display:block}.multi-panel label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer}.multi-panel label:hover{background:var(--head)}
.chips{display:flex;gap:6px;align-items:center}.chip{border:1px solid var(--line);background:var(--chip-bg);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12px}.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.checks{display:flex;flex-direction:column;gap:6px}.checks label{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-inline-start:auto;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.meta b{color:var(--ink);font-weight:700}.meta .file{color:var(--ink);font-weight:600;direction:ltr}
details.map{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}details.map summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:12px}details.map .row{display:flex;flex-wrap:wrap;gap:12px;padding-top:12px}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:9px 13px;font-size:12px}.notice.err{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.stat .k{font-size:11px;color:var(--muted);font-weight:700}.stat .v{font-size:19px;font-weight:800}.stat small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,620px),1fr));gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.panel>header .sub{color:var(--muted);font-size:11px}.tw{overflow:auto;max-height:68vh}
table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}th{position:sticky;top:0;background:var(--head);font-size:11px;font-weight:700;color:var(--muted);z-index:1}
tbody tr:hover{background:var(--head)}td.code{font-family:var(--mono);font-size:12px;direction:ltr}td.nm{text-align:start;max-width:200px;overflow:hidden;text-overflow:ellipsis;direction:ltr;font-size:12px}
td.rk{color:var(--muted);width:1%}td.q{position:relative;font-weight:800}td.q span{position:relative}td.q::before{content:"";position:absolute;top:4px;bottom:4px;right:0;width:var(--w,0%);background:var(--bar);border-radius:3px}
td.neg{color:var(--bad)}td.neg::before{display:none}.empty{padding:28px 14px;text-align:center;color:var(--muted)}

.stock-col{background:rgba(125,179,227,.25)!important;font-weight:800}
.lang-ar{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif}
.lang-en{font-family:"Segoe UI",Tahoma,sans-serif}

<div id="msg" hidden></div>

<div id="app" hidden>
<div class="bar">
<div class="field"><span class="lbl" data-i18n="codesCount">عدد الأكواد</span><div class="chips" id="chips"><button class="chip" type="button" data-n="20">20</button><button class="chip" type="button" data-n="50" aria-pressed="true">50</button><button class="chip" type="button" data-n="100">100</button><input type="number" id="n" min="1" max="1000" value="50"></div></div>

<div class="field"><label data-i18n="entryMonth">شهر الدخول</label><select id="entryMonth"><option value="" data-i18n="allMonths">كل الشهور</option></select></div>
<div class="field"><label data-i18n="fromDate">من تاريخ</label><input type="date" id="entryFrom"></div>
<div class="field"><label data-i18n="toDate">إلى تاريخ</label><input type="date" id="entryTo"></div>
<div class="checks">
<label><input type="checkbox" id="stripSize" checked> <span data-i18n="groupSizes">تجميع المقاسات</span></label>
<label><input type="checkbox" id="soldOnly"> <span data-i18n="leastSoldOnly">الأقل: مباع فقط</span></label>
<label><input type="checkbox" id="stockDeadOnly"> <span data-i18n="stockDeadOnly">الاستوك: لم يباع فقط</span></label>
</div>
<div class="actions">
<button class="btn primary" id="btnCur" data-i18n="btnDownloadExcel">تحميل Excel</button>
<button class="btn" id="btnAll" data-i18n="btnAllDepts">كل الأقسام</button>
<button class="btn" id="btnStockReport" data-i18n="btnDeadReport">📦 تقرير الراكد</button>
</div>
</div>

<div class="meta" id="meta"></div>
<div class="meta" id="stockKpi" hidden></div>

<details class="map"><summary data-i18n="columnsMap">⚙️ الأعمدة المقروءة (تأكد منها)</summary>
<div class="row">
<div class="field"><label data-i18n="colSalesCode">كود مبيعات</label><select id="selBar"></select></div>
<div class="field"><label data-i18n="colName">اسم الصنف</label><select id="selName"></select></div>
<div class="field"><label data-i18n="colQty">الكمية</label><select id="selQty"></select></div>
<div class="field"><label data-i18n="colValue">القيمة</label><select id="selSub"></select></div>
<div class="field"><label data-i18n="colEntry">تاريخ دخول</label><select id="selEntry"></select></div>
<div class="field"><label data-i18n="colStockCode">كود استوك</label><select id="selStockBar"></select></div>
<div class="field"><label data-i18n="colStockQty">كمية استوك</label><select id="selStockQty"></select></div>
</div>
</details>

<div class="stats" id="stats"></div>

<div class="grid">
<section class="panel" id="panelTop"><header><h2 data-i18n="mostSold">🔥 الأكثر مبيعاً</h2><span class="sub" id="subTop"></span></header><div class="tw"><table id="tTop"></table></div></section>
<section class="panel" id="panelBot"><header><h2 data-i18n="leastSold">❄️ الأقل مبيعاً</h2><span class="sub" id="subBot"></span></header><div class="tw"><table id="tBot"></table></div></section>
</div>

<section class="panel" id="panelStock" style="margin-top:14px" hidden><header><h2 data-i18n="deadStock">📦 الراكد - مجمع بالكود</h2><span class="sub" id="subStock"></span></header><div class="tw"><table id="tStock"></table></div></section>
</div>
</div>

<div class="toast" id="toast" hidden></div>

let currentLang='ar';
function t(k){return (I18N[currentLang]&&I18N[currentLang][k])||I18N['ar'][k]||k}
function applyLang(lang){
 currentLang=lang;
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.body.className=lang==='ar'?'lang-ar':'lang-en';

 });
 // Update theme button text

 $('themeBtn').textContent=theme==='dark'?t('themeLight'):t('themeDark');

// ===== CORE (Same as before, with lang-aware status) =====
const Core=(()=>{
  const td=new TextDecoder('utf-8'); const te=new TextEncoder();
  function xmlDecode(s){return s.replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16))).replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(parseInt(d,10))).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&')}

  async function inflateRaw(u8){if(typeof DecompressionStream==='undefined') throw new Error('Browser does not support DecompressionStream - Use modern Chrome');const stream=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(stream).arrayBuffer())}
  async function unzip(buf){const u8=buf instanceof Uint8Array?buf:new Uint8Array(buf);const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);let eocd=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--) if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}if(eocd<0) throw new Error('Invalid xlsx');const count=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);const entries={};for(let i=0;i<count;i++){if(dv.getUint32(p,true)!==0x02014b50) break;const method=dv.getUint16(p+10,true);const csize=dv.getUint32(p+20,true);const nlen=dv.getUint16(p+28,true);const elen=dv.getUint16(p+30,true);const clen=dv.getUint16(p+32,true);const lho=dv.getUint32(p+42,true);const name=td.decode(u8.subarray(p+46,p+46+nlen));entries[name]={method,csize,lho};p+=46+nlen+elen+clen;}return {names:Object.keys(entries),async text(name){const e=entries[name];if(!e) return null;const ln=dv.getUint16(e.lho+26,true);const le=dv.getUint16(e.lho+28,true);const start=e.lho+30+ln+le;const raw=u8.subarray(start,start+e.csize);const data=e.method===0?raw:await inflateRaw(raw);return td.decode(data)}}}
  function colIndex(ref){const m=/^([A-Z]+)/.exec(ref);let n=0;for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64);return n-1}

  function stockTableHtml(list){
    if(!list.length) return '<tbody><tr><td class="empty">'+t('noDead')+'</td></tr></tbody>';
    const head='<thead><tr><th>'+t('th')+'</th><th>'+t('thCode')+'</th><th>'+t('thName')+'</th><th>'+t('thDept')+'</th><th style="background:rgba(125,179,227,.25)">'+t('thDeadStock')+'</th><th>'+t('thDeadSold')+'</th><th>'+t('thDeadEntry')+'</th><th>'+t('thDays')+'</th><th>'+t('thStatus')+'</th></tr></thead>';
    const body=list.map((r,i)=>{
      const days=r.firstEntry?Math.floor((Date.now()-r.firstEntry)/86400000):'-';
      return '<tr><td class="rk n">'+(i+1)+'</td><td class="code">'+esc(r.code)+'</td><td class="nm">'+esc(r.name||'')+'</td><td>'+esc(r.dept||'')+'</td><td class="n stock-col">'+nf.format(r.qty)+'</td><td class="n">'+nf.format(r.saleQty||0)+'</td><td class="n">'+(r.firstEntry?r.firstEntry.toLocaleDateString('en-GB'):'')+'</td><td class="n">'+(typeof days==='number'?nf.format(days):days)+'</td><td><span class="badge">'+esc(r.saleStatus||'')+'</span></td></tr>'
    }).join('');
    return head+'<tbody>'+body+'</tbody>'
  }
  function computeDead(){
    if(!state.stockItems.length) return [];
    const o=getOpts();const salesMap=new Map(state.items.map(i=>[i.code,i]));
    let dead=state.stockItems.map(s=>{
      const sale=salesMap.get(s.code);
      let status=sale?(sale.qty>0?t('sold')+' '+nf.format(sale.qty):t('returned')):t('neverSold');
      return {...s,saleStatus:status,saleQty:sale?sale.qty:0,saleItem:sale}
    });
    if($('stockDeadOnly').checked) dead=dead.filter(d=>d.saleQty<=0);
    if(o.entryMonth) dead=dead.filter(d=>d.firstEntry&&Core.monthKey(d.firstEntry)===o.entryMonth);
    if(o.dateFrom) dead=dead.filter(d=>d.firstEntry&&d.firstEntry>=o.dateFrom);
    if(o.dateTo) dead=dead.filter(d=>d.firstEntry&&d.firstEntry<=o.dateTo);
    if(o.depts.length) dead=dead.filter(d=>!d.saleItem||o.depts.includes(d.saleItem.dept));
    dead.sort((a,b)=>(b.qty||0)-(a.qty||0));
    return dead
  }
  function render(){
    if(!state.items) return;
    const n=getN(),o=getOpts();
    const stockMap=new Map(state.stockItems.map(s=>[s.code,s]));
    const r=Core.rank(state.items,n,o);
    const m=state.meta;
    $('meta').innerHTML='<span class="file">'+esc(state.fileName)+'</span><span>'+t('fileCalc')+' <b>'+nf.format(m.used)+'</b></span><span>'+t('fileShown')+' <b>'+nf.format(r.pool.length)+'</b></span>'+(o.depts.length?'<span>'+t('fileDepts')+': <b>'+esc(o.depts.join(' → '))+'</b></span>':'');
    const totQty=r.pool.reduce((s,i)=>s+i.qty,0),totVal=r.pool.reduce((s,i)=>s+i.value,0),totStock=r.pool.reduce((s,i)=>s+(stockMap.get(i.code)?.qty||0),0);
    $('stats').innerHTML=[
      [t('statCodes'),nf.format(r.pool.length),'of '+nf.format(state.items.length)],
      [t('statSold'),nf.format(totQty),''],
      [t('statValue'),money.format(totVal),''],
      [t('statStock'),nf.format(totStock),t('stockGrouped')]
    ].map(a=>'<div class="stat"><div class="k">'+a[0]+'</div><div class="v">'+a[1]+'</div><small>'+a[2]+'</small></div>').join('');
    if(state.stockItems.length){
      $('stockKpi').hidden=false;
      const totStockAll=state.stockItems.reduce((s,x)=>s+x.qty,0);
      $('stockKpi').innerHTML='<span class="badge">'+t('stockGrouped')+': '+nf.format(state.stockItems.length)+'</span> <span class="badge">'+t('totalPieces')+': '+nf.format(totStockAll)+'</span> <span class="badge">'+t('inCurrent')+': '+nf.format(totStock)+'</span>';
    }
    $('subTop').textContent=o.depts.length?o.depts.join(' → '):t('allDepts');$('subBot').textContent=o.depts.length?o.depts.join(' → '):t('allDepts');
    $('tTop').innerHTML=tableHtml(r.top,'top',r.top.length?r.top[0].qty:0,stockMap);$('tBot').innerHTML=tableHtml(r.bottom,'bottom',0,stockMap);
    const dead=computeDead();
    if(dead.length){$('panelStock').hidden=false;$('tStock').innerHTML=stockTableHtml(dead.slice(0,n));$('subStock').textContent=nf.format(dead.length)+' - '+t('stockGrouped');}else{$('panelStock').hidden=true}
  }
  window.__renderFn=render;

  // Events
  $('fileSales').addEventListener('change',e=>{loadSalesFile(e.target.files[0]);e.target.value='';});
  $('fileStock').addEventListener('change',e=>{loadStockFile(e.target.files[0]);e.target.value='';});
  const drop=$('drop');
  ['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
  document.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f) loadSalesFile(f);});
  $('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c) return;$('n').value=c.dataset.n;render()});
  $('n').addEventListener('input',render);$('entryMonth').addEventListener('change',render);$('entryFrom').addEventListener('change',render);$('entryTo').addEventListener('change',render);
  $('soldOnly').addEventListener('change',render);$('stripSize').addEventListener('change',()=>{runAnalysis()});$('stockDeadOnly').addEventListener('change',render);
  ['selBar','selName','selQty','selSub','selEntry','selStockBar','selStockQty'].forEach(id=>{const el=$(id);if(el) el.addEventListener('change',runAnalysis)});
  $('deptTrigger').addEventListener('click',()=>{$('deptPanel').classList.toggle('open')});
  document.addEventListener('click',e=>{if(!e.target.closest('.multi-dept')) $('deptPanel').classList.remove('open')});

  function download(bytes,name){const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
  function buildFullXlsx(sheetsData){
    const te=new TextEncoder();
    function colName(i){let s='',n=i+1;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
    function xmlEscape(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function sheetXml(sh){
      let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:'+colName(sh.head.length-1)+(sh.rows.length+1)+'"/><sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetData>';
      x+='<row r="1">'+sh.head.map((h,i)=>'<c r="'+colName(i)+'1" t="inlineStr"><is><t>'+xmlEscape(h)+'</t></is></c>').join('')+'</row>';
      x+=sh.rows.map((row,ri)=>'<row r="'+(ri+2)+'">'+row.map((v,ci)=>{
        const ref=colName(ci)+(ri+2);
        if(v===null||v===undefined||v==='') return '<c r="'+ref+'"/>';
        if(typeof v==='number') return '<c r="'+ref+'"><v>'+v+'</v></c>';
        return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(String(v))+'</t></is></c>'
      }).join('')+'</row>').join('');
      x+='</sheetData><autoFilter ref="A1:'+colName(sh.head.length-1)+(sh.rows.length+1)+'"/></worksheet>';
      return x
    }
    function zipStore(files){
      const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
      function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++) c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
      const chunks=[],central=[];let offset=0;const d=new Date();const dosTime=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);const dosDate=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
      for(const f of files){
        const name=te.encode(f.name),crc=crc32(f.data),size=f.data.length;
        const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dosTime,true);lh.setUint16(12,dosDate,true);lh.setUint32(14,crc,true);lh.setUint32(18,size,true);lh.setUint32(22,size,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
        chunks.push(new Uint8Array(lh.buffer),name,f.data);
        const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dosTime,true);ch.setUint16(14,dosDate,true);ch.setUint32(16,crc,true);ch.setUint32(20,size,true);ch.setUint32(24,size,true);ch.setUint16(28,name.length,true);ch.setUint32(42,offset,true);
        central.push(new Uint8Array(ch.buffer),name);offset+=30+name.length+size
      }
      const cdSize=central.reduce((s,c)=>s+c.length,0);const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
      const all=[...chunks,...central,new Uint8Array(end.buffer)];const out=new Uint8Array(all.reduce((s,c)=>s+c.length,0));let p=0;for(const c of all){out.set(c,p);p+=c.length}return out
    }
    const files=[];const add=(name,text)=>files.push({name,data:te.encode(text)});
    const overrides=sheetsData.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('');
    add('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+overrides+'</Types>');
    add('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
    const sheetsXml=sheetsData.map((s,i)=>'<sheet name="'+xmlEscape(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('');
    add('xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0"/></bookViews><sheets>'+sheetsXml+'</sheets></workbook>');
    const rels=sheetsData.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('');
    add('xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'<Relationship Id="rId'+(sheetsData.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
    add('xl/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F4E78"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"/><right style="thin"/><top style="thin"/><bottom style="thin"/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"><alignment horizontal="center" wrapText="1"/></xf></cellXfs></styleSheet>');
    sheetsData.forEach((s,i)=>add('xl/worksheets/sheet'+(i+1)+'.xml',sheetXml(s)));
    return zipStore(files)
  }
  $('btnCur').addEventListener('click',()=>{
    if(!state.items) return;
    try{
      const o=getOpts(),n=getN();
      const stockMap=new Map(state.stockItems.map(s=>[s.code,s]));
      const r=Core.rank(state.items,n,o);
      const HEAD=[t('th'),t('thCode'),t('thName'),t('thDept'),'Variants',t('thSold'),t('thValue'),t('thStock')+' (Grouped)',t('thEntry'),t('thDays')];
      const toRow=(list)=>list.map((it,i)=>[i+1,it.code,it.name,it.dept,it.variants,it.qty,it.value,stockMap.get(it.code)?.qty??0,it.firstEntry?it.firstEntry.toLocaleDateString('en-GB'):'',it.firstEntry?Math.floor((Date.now()-it.firstEntry)/86400000):'']);
      const sheetsData=[
        {name:'Most Sold - '+n,head:HEAD,rows:toRow(r.top)},
        {name:'Least Sold - '+n,head:HEAD,rows:toRow(r.bottom)},
        {name:'All Filtered',head:HEAD,rows:toRow(r.pool.slice().sort((a,b)=>b.qty-a.qty).slice(0,1000))}
      ];
      if(state.stockItems.length){
        const dead=computeDead();
        sheetsData.push({name:'Dead Stock Grouped',head:['Code','Total Stock Qty','Name','Dept','Sold Qty','Entry','Days','Status'],rows:dead.slice(0,1000).map(d=>[d.code,d.qty,d.name||'',d.dept||'',d.saleQty,d.firstEntry?d.firstEntry.toLocaleDateString('en-GB'):'',d.firstEntry?Math.floor((Date.now()-d.firstEntry)/86400000):'',d.saleStatus])});
      }
      const bytes=buildFullXlsx(sheetsData);
      download(bytes,'RAVIN_'+(o.depts.join('_')||t('allDeptsName'))+'_MostAndLeast_'+n+'.xlsx');
      toast(sheetsData.length+' sheets - '+t('excelMost'));
    }catch(e){console.error(e);alert('Excel Error: '+e.message)}
  });
  $('btnAll').addEventListener('click',()=>{
    const o=getOpts();o.depts=[];const n=getN();const stockMap=new Map(state.stockItems.map(s=>[s.code,s]));const r=Core.rank(state.items,n,o);
    const HEAD=[t('th'),t('thCode'),t('thName'),t('thDept'),'Variants',t('thSold'),t('thValue'),t('thStock')+' (Grouped)',t('thEntry'),t('thDays')];
    const toRow=(list)=>list.map((it,i)=>[i+1,it.code,it.name,it.dept,it.variants,it.qty,it.value,stockMap.get(it.code)?.qty??0,it.firstEntry?it.firstEntry.toLocaleDateString('en-GB'):'',it.firstEntry?Math.floor((Date.now()-it.firstEntry)/86400000):'']);
    const sheetsData=[
      {name:'Most Sold - '+n,head:HEAD,rows:toRow(r.top)},
      {name:'Least Sold - '+n,head:HEAD,rows:toRow(r.bottom)}
    ];
    const bytes=buildFullXlsx(sheetsData);
    download(bytes,'RAVIN_AllDepts_MostAndLeast_'+n+'.xlsx');
    toast('All depts: Most + Least');
  });
  $('btnStockReport').addEventListener('click',()=>{
    if(!state.stockItems.length){toast(currentLang==='ar'?'حمل شيت الاستوك أولاً':'Load stock sheet first');return}
    const dead=computeDead();let csv='Code,Total Stock Qty,Name,Dept,Sold Qty,Status\n';
    dead.forEach(d=>{csv+='"'+d.code+'",'+d.qty+',"'+(d.name||'')+'","'+(d.dept||'')+'",'+d.saleQty+','+d.saleStatus+'\n'});
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RAVIN_Stock_Grouped.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  });

  console.log('RAVIN V4 loaded - Theme & Lang ready');
  setDebug(t('msgReady'));
})();
